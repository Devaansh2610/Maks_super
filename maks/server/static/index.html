<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maks</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="hud" id="hud" data-state="idle">

    <!-- Status module: brand + connection -->
    <header class="status-module">
      <span class="brand-name">MAKS</span>
      <span class="conn">
        <span class="dot" id="conn-dot"></span>
        <span id="conn-label">connecting…</span>
      </span>
    </header>

    <!-- Info strip: clock / uptime / battery / weather -->
    <div class="info-strip">
      <span class="info-item"><span id="clock">--:--:--</span></span>
      <span class="info-divider">·</span>
      <span class="info-item">UP <span id="stat-uptime">--</span></span>
      <span class="info-divider" id="battery-divider" hidden>·</span>
      <span class="info-item" id="battery-item" hidden>
        <svg class="battery-icon" viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M17 5h-1V4a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v1H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm2 4h1v4h-1V9Z"/></svg>
        <span id="stat-battery">--</span>%
      </span>
      <span class="info-divider" id="weather-divider" hidden>·</span>
      <span class="info-item" id="weather-item" hidden><span id="stat-weather"></span></span>
    </div>

    <!-- Settings module: gear icon -> slide-out persona panel -->
    <button class="icon-btn settings-toggle" id="settings-toggle" title="Persona settings" aria-label="Persona settings">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19.4 13a7.4 7.4 0 0 0 .07-1 7.4 7.4 0 0 0-.07-1l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.5 7.5 0 0 0-1.73-1l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.63.24-1.22.58-1.73 1l-2.39-.96a.5.5 0 0 0-.6.22L1.75 8.78a.5.5 0 0 0 .12.64L3.9 11a7.4 7.4 0 0 0-.07 1 7.4 7.4 0 0 0 .07 1l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.6.22l2.39-.96c.51.42 1.1.76 1.73 1l.36 2.54c.05.24.25.42.5.42h3.84c.25 0 .45-.18.5-.42l.36-2.54c.63-.24 1.22-.58 1.73-1l2.39.96c.24.1.5 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64L19.4 13Zm-7.4 2.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5Z"/></svg>
    </button>

    <!-- Telemetry columns -->
    <div class="tele-column tele-left">
      <div class="tele-panel" data-metric="cpu">
        <div class="tele-label">CPU</div>
        <div class="tele-value"><span id="stat-cpu">--</span><span class="tele-unit">%</span></div>
        <div class="tele-bar"><div class="tele-bar-fill" id="bar-cpu"></div></div>
      </div>
      <div class="tele-panel" data-metric="ram">
        <div class="tele-label">MEMORY</div>
        <div class="tele-value"><span id="stat-ram">--</span><span class="tele-unit">%</span></div>
        <div class="tele-sub"><span id="stat-ram-detail">-- / -- GB</span></div>
        <div class="tele-bar"><div class="tele-bar-fill" id="bar-ram"></div></div>
      </div>
    </div>

    <div class="tele-column tele-right">
      <div class="tele-panel" data-metric="disk">
        <div class="tele-label">DISK</div>
        <div class="tele-value"><span id="stat-disk">--</span><span class="tele-unit">%</span></div>
        <div class="tele-sub"><span id="stat-disk-detail">-- / -- GB</span></div>
        <div class="tele-bar"><div class="tele-bar-fill" id="bar-disk"></div></div>
      </div>
      <div class="tele-panel" data-metric="net">
        <div class="tele-label">NETWORK</div>
        <div class="tele-net-row"><span class="tele-net-arrow up">▲</span><span id="stat-net-up">--</span><span class="tele-unit">KB/s</span></div>
        <div class="tele-net-row"><span class="tele-net-arrow down">▼</span><span id="stat-net-down">--</span><span class="tele-unit">KB/s</span></div>
      </div>
    </div>

    <!-- Reactor module: central animated visualizer -->
    <main class="ring-module">
      <div class="reactor-wrap">
        <svg class="reactor-svg" viewBox="0 0 300 300" aria-hidden="true">
          <circle class="r-ring r-outer" cx="150" cy="150" r="142" />
          <circle class="r-ring r-outer-ticks" cx="150" cy="150" r="142" />
          <circle class="r-ring r-mid" cx="150" cy="150" r="112" />
          <circle class="r-ring r-mid-dash" cx="150" cy="150" r="112" />
          <circle class="r-ring r-inner" cx="150" cy="150" r="84" />
        </svg>
        <div class="reactor-core"></div>
      </div>
      <div class="state-readout">
        <span class="state-label" id="state-label">idle</span>
        <span class="agent-label" id="agent-label" hidden></span>
      </div>
    </main>

    <!-- Transcript module: current exchange only, bottom corner -->
    <div class="transcript-module" id="transcript" hidden>
      <div class="transcript-line user" id="transcript-user"></div>
      <div class="transcript-line maks" id="transcript-maks"></div>
    </div>

    <!-- Input module: collapsed keyboard fallback, bottom corner -->
    <div class="input-module">
      <form id="chat-form" class="chat-form" hidden>
        <input id="chat-input" type="text" placeholder="Type a command…" autocomplete="off" />
      </form>
      <button class="icon-btn input-toggle" id="input-toggle" title="Type a command" aria-label="Type a command">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm1 2v10h14V7H5Zm2 1.5h2v2H7v-2Zm3.5 0h2v2h-2v-2Zm3.5 0h2v2h-2v-2ZM7 12h2v2H7v-2Zm3.5 0h5.5v2h-5.5v-2Z"/></svg>
      </button>
    </div>

    <!-- Settings slide-out: persona editor -->
    <aside class="settings-panel" id="settings-panel">
      <div class="settings-header">
        <span>Persona</span>
        <button class="icon-btn" id="settings-close" aria-label="Close">✕</button>
      </div>
      <p class="hint">
        Reloaded on every turn — no restart needed. Also editable directly at
        <code>config/system_prompt.md</code>.
      </p>
      <textarea id="persona-text" spellcheck="false"></textarea>
      <div class="persona-actions">
        <button id="persona-save">Save</button>
        <span id="persona-status"></span>
      </div>
    </aside>
    <div class="settings-scrim" id="settings-scrim" hidden></div>

  </div>

  <script src="/static/app.js"></script>
</body>
</html>
